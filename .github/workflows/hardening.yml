name: hardening

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  hardening:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" uv

      - name: Compile Python sources
        run: python3 -m compileall athanasor scripts

      - name: Run test suite
        run: python3 -m pytest tests/ -q

      - name: Verify frozen benchmark protocol
        run: |
          python3 scripts/check_benchmark_protocol.py --benchmark-root benchmarks/operations-decision-support-v1 --repo-root .

      - name: Verify public release contract
        run: python3 scripts/check_release.py

      - name: Check CLI diagnostics
        run: python3 scripts/check_cli_diagnostics.py

      - name: Check CLI
        run: python3 scripts/check_cli.py

      - name: Run pipeline smoke
        run: |
          python3 scripts/check_pipeline_smoke.py

      - name: Run hardening audit
        run: |
          python3 scripts/hardening_audit.py --project-root .

      - name: Run negative-path checks
        run: |
          python3 scripts/check_negative_paths.py

      - name: Verify release artifacts outside checkout
        run: |
          rm -rf dist
          uv build --wheel --sdist --out-dir dist
          python3 scripts/check_wheel_install.py \
            --wheel 'dist/azoth-*.whl' \
            --sdist 'dist/azoth-*.tar.gz' \
            --expected-version 0.2.0 \
            --python '${{ matrix.python-version }}'
